[project]
name = "triplex-gateway"
version = "0.1.0"
description = "Triplex Control Gateway - Cloud control API for phone-first agent runtime"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "python-multipart>=0.0.9",
    "alembic>=1.13.0",
    "PyJWT>=2.9.0,<3.0.0",
    "slowapi>=0.1.9,<1.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "webauthn>=2.0.0,<3.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
asyncio_mode = "auto"

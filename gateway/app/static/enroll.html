<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triplex Passkey Enrollment</title>
<style>
* { box-sizing: border-box; font-family: -apple-system, sans-serif; }
body { max-width: 600px; margin: 50px auto; padding: 20px; background: #0a0a0a; color: #fff; }
h1 { font-size: 32px; margin-bottom: 10px; }
.subtitle { color: #888; margin-bottom: 40px; }
input { width: 100%; padding: 16px; margin-bottom: 16px; border: 1px solid #333; border-radius: 8px; background: #1a1a1a; color: #fff; font-size: 16px; }
button { width: 100%; padding: 16px; background: #007AFF; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-bottom: 12px; }
button:disabled { background: #555; cursor: not-allowed; }
.status { padding: 16px; background: #1a1a1a; border-radius: 8px; margin-top: 20px; display: none; }
.status.success { border-left: 4px solid #34C759; }
.status.error { border-left: 4px solid #FF3B30; }
.status.info { border-left: 4px solid #007AFF; }
.info { font-size: 14px; color: #888; margin-top: 24px; }
#login-section { display: none; }
.check { padding: 12px; margin: 10px 0; border-radius: 8px; }
.check.ok { background: #1a4d1a; }
.check.fail { background: #4d1a1a; }
</style>
</head>
<body>
<div id="checks" style="margin-bottom: 30px;">
<h3>WebAuthn Compatibility Check</h3>
<div id="check-https" class="check"></div>
<div id="check-webauthn" class="check"></div>
<div id="check-platform" class="check"></div>
</div>

<div id="register-section">
<h1>Create Account</h1>
<p class="subtitle">Register with passkey (Face ID, Touch ID, or security key)</p>
<input type="email" id="register-email" placeholder="Email address">
<button id="register-btn" onclick="startRegistration()">Create Passkey</button>
<div id="register-status" class="status"></div>
<button onclick="showLogin()" style="background: transparent; color: #007AFF; margin-top: 12px;">Already have an account? Sign In</button>
</div>

<div id="login-section">
<h1>Sign In</h1>
<p class="subtitle">Authenticate with your passkey</p>
<input type="email" id="login-email" placeholder="Email address">
<button id="login-btn" onclick="startLogin()">Sign In with Passkey</button>
<div id="login-status" class="status"></div>
<button onclick="showRegister()" style="background: transparent; color: #007AFF; margin-top: 12px;">Need an account? Register</button>
</div>

<p class="info">Passkeys work with Face ID, Touch ID, Windows Hello, or security keys.</p>

<script>
// Check WebAuthn compatibility
const isHTTPS = window.location.protocol === 'https:';
const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
const hasWebAuthn = window.PublicKeyCredential !== undefined;
let hasPlatformAuth = false;

document.getElementById('check-https').textContent = isHTTPS || isLocalhost ? '✅ Secure Context (HTTPS/localhost)' : '❌ Not HTTPS - WebAuthn requires HTTPS';
document.getElementById('check-https').className = isHTTPS || isLocalhost ? 'check ok' : 'check fail';

document.getElementById('check-webauthn').textContent = hasWebAuthn ? '✅ WebAuthn API available' : '❌ WebAuthn not supported';
document.getElementById('check-webauthn').className = hasWebAuthn ? 'check ok' : 'check fail';

if (hasWebAuthn) {
    PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()
        .then(result => {
            hasPlatformAuth = result;
            document.getElementById('check-platform').textContent = result ? 
                '✅ Platform authenticator available (Touch ID/Face ID/Windows Hello)' : 
                '⚠️ No platform authenticator - Security key required';
            document.getElementById('check-platform').className = result ? 'check ok' : 'check fail';
        })
        .catch(err => {
            document.getElementById('check-platform').textContent = '⚠️ Cannot check platform auth: ' + err.message;
            document.getElementById('check-platform').className = 'check fail';
        });
} else {
    document.getElementById('check-platform').textContent = '⚠️ Skipped (WebAuthn not available)';
}

const API_BASE = window.location.origin;

function base64urlDecode(str) {
    str = str.replace(/-/g, '+').replace(/_/g, '/');
    while (str.length % 4) str += '=';
    return Uint8Array.from(atob(str), c => c.charCodeAt(0));
}

function base64urlEncode(buffer) {
    let binary = '';
    const bytes = new Uint8Array(buffer);
    for (let b of bytes) binary += String.fromCharCode(b);
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}

async function startRegistration() {
    const email = document.getElementById("register-email").value.trim();
    if (!email) { showStatus("register-status", "Enter your email", "error"); return; }

    const btn = document.getElementById("register-btn");
    btn.disabled = true; btn.textContent = "Creating...";

    try {
        showStatus("register-status", "Requesting challenge...", "info");
        
        const startResp = await fetch(`${API_BASE}/api/auth/register/start`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        });
        if (!startResp.ok) throw new Error((await startResp.json()).detail || "Failed");
        
        const startData = await startResp.json();
        const options = JSON.parse(startData.options);
        
        showStatus("register-status", "Prompting for biometric...", "info");
        
        options.challenge = base64urlDecode(options.challenge);
        options.user.id = base64urlDecode(options.user.id);

        console.log("Registration options:", options);

        const credential = await navigator.credentials.create({ publicKey: options });
        
        showStatus("register-status", "Verifying credential...", "info");

        const finishData = {
            challenge_id: startData.challenge_id,
            email: email,
            credential: {
                id: credential.id,
                rawId: base64urlEncode(credential.rawId),
                response: {
                    attestationObject: base64urlEncode(credential.response.attestationObject),
                    clientDataJSON: base64urlEncode(credential.response.clientDataJSON),
                },
                type: credential.type,
                clientExtensionResults: credential.clientExtensionResults || {},
            }
        };

        const finishResp = await fetch(`${API_BASE}/api/auth/register/finish`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(finishData)
        });
        if (!finishResp.ok) {
            const errData = await finishResp.json();
            throw new Error(errData.detail || "Failed");
        }

        showStatus("register-status", "✅ Passkey created successfully!", "success");
        setTimeout(() => showLogin(email), 1000);
    } catch (error) {
        console.error("Registration error:", error);
        showStatus("register-status", "Error: " + error.message, "error");
    } finally {
        btn.disabled = false; btn.textContent = "Create Passkey";
    }
}

async function startLogin() {
    const email = document.getElementById("login-email").value.trim();
    if (!email) { showStatus("login-status", "Enter your email", "error"); return; }

    const btn = document.getElementById("login-btn");
    btn.disabled = true; btn.textContent = "Authenticating...";

    try {
        showStatus("login-status", "Requesting challenge...", "info");
        
        const startResp = await fetch(`${API_BASE}/api/auth/login/start`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        });
        if (!startResp.ok) throw new Error((await startResp.json()).detail || "Failed");
        
        const startData = await startResp.json();
        const options = JSON.parse(startData.options);
        
        showStatus("login-status", "Prompting for biometric...", "info");
        
        options.challenge = base64urlDecode(options.challenge);
        
        if (options.allowCredentials) {
            options.allowCredentials = options.allowCredentials.map(cred => ({
                ...cred,
                id: base64urlDecode(cred.id)
            }));
        }

        console.log("Login options:", options);

        const assertion = await navigator.credentials.get({ publicKey: options });
        
        showStatus("login-status", "Verifying credential...", "info");

        const finishData = {
            challenge_id: startData.challenge_id,
            credential: {
                id: assertion.id,
                rawId: base64urlEncode(assertion.rawId),
                response: {
                    authenticatorData: base64urlEncode(assertion.response.authenticatorData),
                    clientDataJSON: base64urlEncode(assertion.response.clientDataJSON),
                    signature: base64urlEncode(assertion.response.signature),
                    userHandle: assertion.response.userHandle ? base64urlEncode(assertion.response.userHandle) : null,
                },
                type: assertion.type,
                clientExtensionResults: assertion.clientExtensionResults || {},
            }
        };

        const finishResp = await fetch(`${API_BASE}/api/auth/login/finish`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(finishData)
        });
        if (!finishResp.ok) {
            const errData = await finishResp.json();
            throw new Error(errData.detail || "Failed");
        }

        showStatus("login-status", "✅ Authentication successful!", "success");
    } catch (error) {
        console.error("Login error:", error);
        showStatus("login-status", "Error: " + error.message, "error");
    } finally {
        btn.disabled = false; btn.textContent = "Sign In with Passkey";
    }
}

function showStatus(id, msg, type) {
    const el = document.getElementById(id);
    el.textContent = msg; el.className = "status " + type; el.style.display = "block";
}

function showLogin(email = "") {
    document.getElementById("register-section").style.display = "none";
    document.getElementById("login-section").style.display = "block";
    if (email) document.getElementById("login-email").value = email;
}

function showRegister() {
    document.getElementById("login-section").style.display = "none";
    document.getElementById("register-section").style.display = "block";
}
</script>
</body>
</html>

# Production gateway for bridge.secure.build.
#
# Caddy terminates TLS and reverse-proxies bridge.secure.build to
# 127.0.0.1:9090, so the gateway binds loopback only and is never exposed
# directly. Media never transits this service: the answer webhook returns
# routing XML and Plivo connects the call to the device.
#
# Secrets come from .env.prod alongside this file (not in the repo).
services:
  gateway:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://triplex:${POSTGRES_PASSWORD}@db:5432/triplex
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - PLIVO_AUTH_TOKEN=${PLIVO_AUTH_TOKEN}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - VOICE_SERVICE_URL=${VOICE_SERVICE_URL:-http://127.0.0.1:8801}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=triplex
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=triplex
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triplex"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triplex"
version = "0.1.0"
description = "Modern voice agent for autonomous phone calls - evolution of Google Duplex"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
authors = [
    {name = "Ryan MacArthur", email = "ryan.macarthur@gmail.com"}
]
keywords = ["voice-agent", "duplex", "ai", "phone-automation", "speech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "torchaudio>=2.2",
    "onnxruntime>=1.17",
    "pydantic>=2.6",
    "httpx>=0.27",
    "websockets>=12.0",
    "av>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.2",
    "mypy>=1.8",
    "bandit>=1.7",
    "build>=1.2",
    "cfn-lint>=1.40",
]

tts = [
    "kokoro>=0.9.2",
    "soundfile>=0.12",
]

aws = [
    "boto3>=1.34",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

voice-clone = [
    "qwen-tts==0.1.1",
]

mlx = [
    "mlx>=0.9",
    "mlx-audio>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
triplex = ["py.typed", "transport/meeting_gateway_static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
    "kokoro.*",
    "qwen_tts.*",
    "scipy.*",
    "vllm.*",
    "av.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[package]
name = "triplex-agent-core"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
triplex-native-media = { path = "../native-media" }
libc = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
pedantic = "allow"

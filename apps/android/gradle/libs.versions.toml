rikka-ui-foundation = { group = "dev.rikkaui", name = "foundation", version.ref = "rikkaUi" }
rikka-icons-core = { group = "dev.rikkaui.icons", name = "core", version.ref = "rikkaIcons" }
rikka-icons-tokens-core = { group = "dev.rikkaui.icons", name = "tokens-core", version.ref = "rikkaIcons" }

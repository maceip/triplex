AWSTemplateFormatVersion: '2010-09-09'
Description: Triplex Chime SIP Lambda and media-event infrastructure

Parameters:
  CodeBucket:
    Type: String
    Description: Existing S3 bucket containing the packaged SIP Lambda
  CodeKey:
    Type: String
    Default: triplex/sip-handler.zip
  KvsPoolArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:chime:[^:]+:[0-9]{12}:media-pipeline-kinesis-video-stream-pool/.+$'
    Description: ACTIVE Chime media-pipeline KVS pool ARN in this Region
Resources:
  SipHandlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ChimeCallResources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - chime:CreateMeeting
                  - chime:CreateAttendee
                  - chime:DeleteMeeting
                  - chime:CreateMediaStreamPipeline
                  - chime:DeleteMediaPipeline
                  - chime:TagResource
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'

  SipHandler:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !GetAtt SipHandlerRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Timeout: 15
      MemorySize: 256
      ReservedConcurrentExecutions: 50
      TracingConfig: {Mode: Active}
      Environment:
        Variables:
          MEETING_REGION: !Ref AWS::Region
          KVS_POOL_ARN: !Ref KvsPoolArn
          KVS_RESERVED_STREAM_CAPACITY: '2'

  SipHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SipHandler}
      RetentionInDays: 30

  AllowChimeInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SipHandler
      Principal: voiceconnector.chime.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  CallEventsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600

  CallEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      KmsMasterKeyId: alias/aws/sqs
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CallEventsDeadLetterQueue.Arn
        maxReceiveCount: 5

  ChimeStreamEvents:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source: [aws.chime]
        detail-type: [Chime Media Pipeline State Change]
        detail:
          eventType:
            - chime:MediaPipelineKinesisVideoStreamStart
            - chime:MediaPipelineKinesisVideoStreamEnd
      State: ENABLED
      Targets:
        - Arn: !GetAtt CallEventsQueue.Arn
          Id: triplex-call-events
          DeadLetterConfig: {Arn: !GetAtt CallEventsDeadLetterQueue.Arn}
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 10

  CallEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref CallEventsQueue, !Ref CallEventsDeadLetterQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sqs:SendMessage
            Resource:
              - !GetAtt CallEventsQueue.Arn
              - !GetAtt CallEventsDeadLetterQueue.Arn
            Condition:
              ArnEquals: {aws:SourceArn: !GetAtt ChimeStreamEvents.Arn}

Outputs:
  SipHandlerArn:
    Value: !GetAtt SipHandler.Arn
  CallEventsQueueUrl:
    Value: !Ref CallEventsQueue
  CallEventsQueueArn:
    Value: !GetAtt CallEventsQueue.Arn
